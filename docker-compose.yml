services:
  publisher-embedded-frontend:
    build: .
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Additional services for complete infrastructure
  # These represent the other containers mentioned in the issue
  
  marketing-frontend:
    # Placeholder for marketing frontend service
    # Uses Alpine 3.22.1 instead of EOL 3.16
    image: alpine:3.22.1
    command: sh -c "echo 'Marketing frontend placeholder - Alpine 3.22.1' && sleep infinity"
    
  facebook-graph-proxy:
    # Placeholder for facebook graph proxy service  
    # Uses Alpine 3.22.1 instead of EOL 3.14
    image: alpine:3.22.1
    command: sh -c "echo 'Facebook graph proxy placeholder - Alpine 3.22.1' && sleep infinity"
    
  pdf-service:
    # Placeholder for PDF service
    # Uses Alpine 3.22.1 instead of EOL 3.18
    image: alpine:3.22.1
    command: sh -c "echo 'PDF service placeholder - Alpine 3.22.1' && sleep infinity"
    
  seller-frontend:
    # Placeholder for seller frontend service
    # Uses Alpine 3.22.1 instead of EOL 3.18  
    image: alpine:3.22.1
    command: sh -c "echo 'Seller frontend placeholder - Alpine 3.22.1' && sleep infinity"

networks:
  default:
    name: peddle-publisher-network