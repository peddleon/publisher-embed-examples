events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Serve bootstrap example
        location /bootstrap/ {
            alias /usr/share/nginx/html/example-bootstrap/;
            try_files $uri $uri/ /bootstrap/index.html;
        }

        # Serve Next.js built example
        location /nextjs/ {
            alias /usr/share/nginx/html/example-nextjs/out/;
            try_files $uri $uri/ /nextjs/index.html;
        }

        # Serve common usage examples
        location /examples/ {
            alias /usr/share/nginx/html/examples-common-usage/;
            try_files $uri $uri/ =404;
        }

        # Default route serves the main index
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}